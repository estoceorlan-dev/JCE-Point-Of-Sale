  scannerDuplicateSuppressionMs: Int!
  printerType: String!
  printerAddress: String
  printerPort: Int!
  printerPaperWidthMm: Int!
  cashDrawerEnabled: Boolean!
  cashDrawerPin: Int!
  isActive: Boolean!
  version: Int!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  deletedAt: Timestamp
}

