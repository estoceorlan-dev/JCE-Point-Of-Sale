# SQL Connect maps these synchronization-facing types to the migration-owned
# PostgreSQL tables. Business writes are exposed by authenticated callable
# commands because checkout and ledger validation require server code; typed
# SQL Connect operations provide the pull/read contract used by the sync layer.

type AppUser @table(name: "app_users", key: "id") {
  id: String!
  organizationId: String!
  firebaseUid: String
  email: String!
  displayName: String!
  status: String!
  invitedAt: Timestamp
  activatedAt: Timestamp
  version: Int!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  deletedAt: Timestamp
}

type UserRoleAssignment @table(name: "user_role_assignments", key: "id") {
  id: String!
  organizationId: String!
  branchId: String
  userId: String!
  roleId: String!
  user: AppUser! @ref(fields: "userId", references: "id")
  role: Role! @ref(fields: "roleId", references: "id")
  version: Int!
  assignedAt: Timestamp!
  updatedAt: Timestamp!
  revokedAt: Timestamp
}

type Role @table(name: "roles", key: "id") {
  id: String!
  organizationId: String!
  code: String!
  name: String!
  description: String
  isActive: Boolean!
  version: Int!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  deletedAt: Timestamp
}

# Administration projections are migration-owned. No client write operations
# are exposed; authenticated callable commands enforce organization-wide roles.
type Branch @table(name: "branches", key: "id") {
  id: String!
  organizationId: String!
  code: String!
  name: String!
  timezone: String!
  addressLineOne: String
  addressLineTwo: String
  city: String
  province: String
  postalCode: String
  phone: String
  email: String
  receiptDisplayName: String
  isActive: Boolean!
  allowNegativeStock: Boolean!
  adjustmentApprovalThresholdMilli: Int64
  allowMultipleOpenShiftsPerUser: Boolean!
  allowSalesWithoutOpenShift: Boolean!
  cashDiscrepancyApprovalThresholdMinor: Int64
  discountApprovalThresholdBasisPoints: Int
  returnApprovalThresholdMinor: Int64
  voidWindowMinutes: Int!
  transferApprovalThresholdMilli: Int64
  version: Int!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  deletedAt: Timestamp
}

type Register @table(name: "registers", key: "id") {
